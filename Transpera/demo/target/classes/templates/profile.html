<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Profile</title>

    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/sidebar.css">

</head>


<body>


    <div class="sidebar">

        <h2>
            🚗 Transpera
        </h2>


        <a href="/dashboard">
            Dashboard
        </a>


        <a href="/addVehicles">
            Add Vehicle
        </a>

        <a href="/viewVehicles">
            View Vehicles
        </a>

        <a href="/profile">
            Profile
        </a>

        <a href="/logout">
            Logout
        </a>
    </div>
    <div class="main-content">
        <div class="profile-card">
            <h1>
                My Profile
            </h1>
            <div class="profile-info">
                <div class="info-box">
                    <label>
                        User ID
                    </label>
                    <p th:text="${user.id}">
                    </p>
                </div>
                <div class="info-box">
                    <label>
                        Username
                    </label>
                    <p th:text="${user.username}">
                    </p>
                </div>
                <div class="info-box">
                    <label>
                        Email
                    </label>
                    <p th:text="${user.email}">
                    </p>

                </div>
            </div>
            <a href="/dashboard">
                <button>
                    Back to Dashboard
                </button>
            </a>
        </div>
    </div>
</body>

</html>
