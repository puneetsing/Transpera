<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Vehicle</title>
    <link rel="stylesheet" th:href="@{/css/editVehicle.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>

<body>
    <aside id="sidebar"
       class="sidebar">


    <!-- Sidebar Header -->

    <div class="sidebar-header">

        <div class="brand">

            <span class="brand-icon">
                🚗
            </span>

            <div>

                <h2>
                    Transpera
                </h2>

                <span>
                    Vehicle Management
                </span>

            </div>

        </div>


        <button id="closeSidebar"
                class="close-sidebar">

            &times;

        </button>

    </div>



    <!-- Navigation -->

    <nav class="sidebar-nav">


        <a href="/dashboard"
           class="nav-item active">

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Dashboard
            </span>

        </a>



        <a href="/addVehicles"
           id="openAddVehicle"
           class="nav-item">

            <span class="nav-icon">
                ＋
            </span>

            <span>
                Add Vehicle
            </span>

        </a>



        <a href="/viewVehicles"
           class="nav-item">

            <span class="nav-icon">
                🚚
            </span>

            <span>
                Vehicles
            </span>

        </a>



        <a href="/profile"
           class="nav-item">

            <span class="nav-icon">
                ♙
            </span>

            <span>
                Profile
            </span>

        </a>

        <a href="/settings"
           class="nav-item">

            <span class="nav-icon">
                ⚙
            </span>

            <span>
                Settings
            </span>

        </a>

    </nav>

    <div class="sidebar-bottom">

        <a href="/logout"
           class="nav-item logout">
            <span class="nav-icon">
                ↪
            </span>
            <span>
                Logout
            </span>
        </a>
    </div>

</aside>

    <div class="main-content">
        <h1>
            Edit Vehicle
        </h1>
        <form action="/updateVehicle" method="post">
            <input type="hidden" name="id" th:value="${vehicle.id}">
            <label>Vehicle Name</label>
            <input type="text" name="vehicleName" th:value="${vehicle.vehicleName}">
            <label>Vehicle Type</label>
            <input type = "text" name = "vehicleType" th:value="${vehicle.vehicleType}">
            <label>Vehicle Number</label>
            <input type="text" name="vehicleNumber" th:value="${vehicle.vehicleNumber}">
            <label>Brand</label>
            <input type="text" name="vehicleBrand" th:value="${vehicle.vehicleBrand}">
            <label>Model</label>
            <input type="text" name="vehicleModel" th:value="${vehicle.vehicleModel}">
            <label>KM Driven</label>
            <input type="number" name="drivenKM" th:value="${vehicle.drivenKM}">
            <label>Status</label>
            <select name="status">
                <option value="ACTIVE">
                    Active
                </option>
                <option value="MAINTENANCE">
                    Maintenance
                </option>
                <option value="INACTIVE">
                    Inactive
                </option>
            </select>
            <button type="submit">
                Update Vehicle
            </button>
        </form>
    </div>
</body>
</html>
