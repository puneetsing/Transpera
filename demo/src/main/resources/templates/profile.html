<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Profile</title>

    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" th:href="/css/style.css">

</head>


<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div class="main-content">
        <div class="profile-card">
            <h1>
                My Profile
            </h1>
            <div class="profile-info">
                <div class="info-box">
                    <label>
                        User ID
                    </label>
                    <p th:text="${user.id}">
                    </p>
                </div>
                <div class="info-box">
                    <label>
                        Username
                    </label>
                    <p th:text="${user.username}">
                    </p>
                </div>
                <div class="info-box">
                    <label>
                        Email
                    </label>
                    <p th:text="${user.email}">
                    </p>

                </div>
                <a href="/dashboard">
                    <button>
                        Back to Dashboard
                    </button>
                </a>
            </div>
        </div>
        <script th:src="@{/js/script.js}">
        </script>
</body>

</html>
