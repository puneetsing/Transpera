<!DOCTYPE html>
<html>

<head>
    <title>Add Vehicle</title>
    <link rel="stylesheet" href="/css/addVehicles.css">
    <link rel="stylesheet" href="/css/sidebar.css">
</head>

<body>
<aside id="sidebar"
       class="sidebar">


    <!-- Sidebar Header -->

    <div class="sidebar-header">

        <div class="brand">

            <span class="brand-icon">
                🚗
            </span>

            <div>

                <h2>
                    Transpera
                </h2>

                <span>
                    Vehicle Management
                </span>

            </div>

        </div>


        <button id="closeSidebar"
                class="close-sidebar">

            &times;

        </button>

    </div>



    <!-- Navigation -->

    <nav class="sidebar-nav">


        <a href="/dashboard"
           class="nav-item active">

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Dashboard
            </span>

        </a>



        <a href="/addVehicles"
           id="openAddVehicle"
           class="nav-item">

            <span class="nav-icon">
                ＋
            </span>

            <span>
                Add Vehicle
            </span>

        </a>



        <a href="/viewVehicles"
           class="nav-item">

            <span class="nav-icon">
                🚚
            </span>

            <span>
                Vehicles
            </span>

        </a>



        <a href="/profile"
           class="nav-item">

            <span class="nav-icon">
                ♙
            </span>

            <span>
                Profile
            </span>

        </a>

        <a href="/settings"
           class="nav-item">

            <span class="nav-icon">
                ⚙
            </span>

            <span>
                Settings
            </span>

        </a>

    </nav>

    <div class="sidebar-bottom">

        <a href="/logout"
           class="nav-item logout">
            <span class="nav-icon">
                ↪
            </span>
            <span>
                Logout
            </span>
        </a>
    </div>

</aside>

    <div class="main-content">

        <div class="card">

            <h1>Add Vehicle</h1>

            <form action="/addVehicles" object="${vehicle}" method="post">

                <label>Vehicle Name</label>
                <input type="text" name="vehicleName" required>

                <label>Vehicle Type</label>
                <select name="vehicleType" class="form-control" required>
                    <option value="Car">Car</option>
                    <option value="bike">bike</option>
                    <option value="Truck">Truck</option>
                    <option value="Bus">Bus</option>
                </select>
                <label>Vehicle Number</label>
                <input type="text" name="vehicleNumber" required>

                <label>KM Driven</label>
                <input type="number" name="drivenKM" required>

                <label>Vehicle Brand</label>
                <input type="text" name="vehicleBrand" required>

                <label>Vehicle Model</label>
                <input type="text" name="vehicleModel" required>

                <label>Fueltype</label>
                <select id="fuelType" name="fuelType" class="form-control" required>
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="Electric">Electric</option>
                    <option value="CNG">CNG</option>
                </select>


                <label>Status</label>
                <select id="status" name="status" class="form-control" required>
                    <option value="Active">Active</option>
                    <option value="under Maintenance">under Maintenance</option>
                    <option value="Inactive">Inactive</option>
                </select>

                <button type="submit">
                    Save Vehicle
                </button>

            </form>

        </div>

    </div>
<script src="/js/sidebar.js"></script>
</body>

</html>
