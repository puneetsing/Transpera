<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">

</head>

<body>

<div th:fragment="sidebar" class="sidebar-wrapper">

    <!-- Open button: stays visible when sidebar is closed -->
    <button id="openSidebarBtn"
            class="open-sidebar-btn"
            type="button"
            aria-label="Open sidebar"
            aria-controls="sidebar">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- Sidebar overlay -->
    <aside id="sidebar" class="panel">

        <!-- Header -->
        <div class="header">
            <h1>Transpera</h1>

            <!-- Close button -->
            <button class="toggle-btn"
                    id="toggleBtn"
                    type="button"
                    aria-label="Close sidebar">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Menu -->
        <nav class="menu">

            <a th:href="@{/dashboard}" class="menu-item">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a th:href="@{/profile}" class="menu-item">
                <i class="fa-solid fa-user"></i>
                <span>My Profile</span>
            </a>

            <div class="divider"></div>

            <a th:href="@{/viewVehicles}" class="menu-item">
                <i class="fa-solid fa-truck"></i>
                <span>Vehicles</span>
            </a>

            <a th:href="@{/addVehicles}" class="menu-item">
                <i class="fa-solid fa-plus"></i>
                <span>Add Vehicles</span>
            </a>

            <div class="divider"></div>

            <a th:href="@{/settings}" class="menu-item">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>

            <!-- Keep this as a placeholder until logout is implemented -->
            <a th:href="@{/logout}" class="menu-item">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>

        </nav>

    </aside>

</div>

</body>
</html>
